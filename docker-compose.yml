services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:"${STACK_VER}"
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=elasticsearch-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/fullchain.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/cert.key
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/fullchain.crt
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300

  kibana:
    image: docker.elastic.co/kibana/kibana:"${STACK_VER}"
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - SERVERNAME=kibana.local
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/cert.key
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/fullchain.crt
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD="${KIBANA_PWD}"
    volumes:
      - ./certs:/usr/share/kibana/config/certs:ro
    ports:
      - 5601:5601

volumes:
  elasticsearch_data:
