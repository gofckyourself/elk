version: '3.7'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:$ELASTIC_VERSION
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms8G -Xmx8G"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ${ELK_CERT_PATH}:/usr/share/elasticsearch/config/cert.pem
      - ${ELK_CERT_KEY_PATH}:/usr/share/elasticsearch/config/cert.key
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl --cacert /usr/share/elasticsearch/config/cert.pem -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:$ELASTIC_VERSION
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=https://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - ${ELK_CERT_PATH}:/usr/share/kibana/config/cert.pem
      - ${ELK_CERT_KEY_PATH}:/usr/share/kibana/config/cert.key
    depends_on: 
      - elasticsearch
    
    ports:
      - 5601:5601
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s http://localhost:5601/login | grep -q 'Kibana'"]
      interval: 30s
      timeout: 10s
      retries: 5
    

  logstash:
    image: docker.elastic.co/logstash/logstash:$ELASTIC_VERSION
    container_name: logstash
    volumes:
      - ./logstash/pipeline/:/usr/share/logstash/pipeline/
      - ./logstash/config/:/usr/share/logstash/config/
    ports:
      - 5000:5000
      - 9600:9600
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - elk-net
    depends_on:
      - elasticsearch

networks:
  elk-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16