version: '3.7'
services:

  setup:
    build:
      context: setup/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    init: true
    volumes:
      - ./setup/entrypoint.sh:/entrypoint.sh:ro,Z
      - ./setup/lib.sh:/lib.sh:ro,Z
      - ./setup/roles:/roles:ro,Z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      METRICBEAT_INTERNAL_PASSWORD: ${METRICBEAT_INTERNAL_PASSWORD:-}
      FILEBEAT_INTERNAL_PASSWORD: ${FILEBEAT_INTERNAL_PASSWORD:-}
      HEARTBEAT_INTERNAL_PASSWORD: ${HEARTBEAT_INTERNAL_PASSWORD:-}
      MONITORING_INTERNAL_PASSWORD: ${MONITORING_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    networks:
      - elk-net
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:$ELASTIC_VERSION
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms8G -Xmx8G"
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.keystore.path=$ES_HOME/config/elasticsearch.p12
      - xpack.security.http.ssl.truststore.path=$ES_HOME/config/elasticsearch.p12
      - xpack.security.http.ssl.client_authentication=required
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./certs/elk-ca.pem:/usr/share/elasticsearch/config/elk-ca.pem
      - ./certs/elk.crt:/usr/share/elasticsearch/config/elasticsearch.crt
      - ./certs/elk.key :/usr/share/elasticsearch/config/elasticsearch.key
      - ./certs/elasticsearch.p12:/usr/share/elasticsearch/config/elasticsearch.p12
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      - elk-net
    
    healthcheck:
      test: ["CMD-SHELL", "curl --cacert /usr/share/elasticsearch/config/cert.pem -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:$ELASTIC_VERSION
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=https://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.reporting.kibanaServer.hostname=localhost
      - xpack.reporting.roles.enabled=false
    volumes:
      - ./certs:/usr/share/kibana/config/
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z
    depends_on: 
      - elasticsearch
    
    ports:
      - 5601:5601
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s http://localhost:5601/login | grep -q 'Kibana'"]
      interval: 30s
      timeout: 10s
      retries: 5
    

  logstash:
    image: docker.elastic.co/logstash/logstash:$ELASTIC_VERSION
    container_name: logstash
    volumes:
      - ./logstash/pipeline/:/usr/share/logstash/pipeline/
      - ./logstash/config/:/usr/share/logstash/config/
    ports:
      - 5000:5000
      - 9600:9600
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - elk-net
    depends_on:
      - elasticsearch

networks:
  elk-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16