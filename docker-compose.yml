version: "3.7"

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
      - certs:$CERTS_DIR
      - esconfig01:/usr/share/elasticsearch/config/

    ports:
      - ${ES_PORT}:9200
    environment:
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - node.name=es01
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=$CERTS_DIR/es01/elk.key
      - xpack.security.transport.ssl.certificate=$CERTS_DIR/es01/elk.crt
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=$CERTS_DIR/es01/elk.key
      - xpack.security.http.ssl.certificate=$CERTS_DIR/es01/elk.crt
      - discovery.type=single-node
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KEYSTORE_PASSWORD=${KEYSTORE_PWD}

    networks:
      - elastic


    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s https://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - kibanadata:/usr/share/kibana/data
      - certs:/usr/share/kibana/config/certs
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/elk.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/elk.key
      - SERVER_SSL_KEYPASSPHRASE=${KEYPASSPHRASE}
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.certificate_authorities=/usr/share/kibana/config/certs/ca.crt
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca.crt
    networks:
      - elastic
    depends_on:
      - es01

       
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I https://localhost:5601"]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  esdata01:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/esdata01
  esconfig01:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/esconfig
  certs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./certs
  kibanadata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/kibana
networks:
  elastic: