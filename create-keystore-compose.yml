version: '3'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    command: >
      bash -c '
        if [[ ! -f /usr/share/elasticsearch/config/elasticsearch.keystore ]]; then
          bin/elasticsearch-keystore create;
        fi;
        chown -R elasticsearch:elasticsearch /usr/share/elasticsearch/config;
        sleep infinity
      '
    volumes:
      - ./elasticsearch-keystore:/usr/share/elasticsearch/config

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    command: >
      bash -c '
        if [[ ! -f /usr/share/kibana/config/kibana.keystore ]]; then
          bin/kibana-keystore create;
        fi;
        chown -R kibana:kibana /usr/share/kibana/config;
        sleep infinity
      '
    volumes:
      - ./kibana-keystore:/usr/share/kibana/config
